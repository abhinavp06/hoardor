function build(node, depth, parent) {
  const li = document.createElement("li");
  li.className = "k-" + node.kind;
  const row = document.createElement("div");
  row.className = "row";
  const twisty = document.createElement("span");
  twisty.className = "twisty";
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = node.label;
  const desc = document.createElement("span");
  desc.className = "desc";
  desc.textContent = node.desc;
  row.append(twisty, label);
  if (node.kind !== "item" && node.kind !== "dir" && node.kind !== "file") {
    const badge = document.createElement("span");
    badge.className = "badge b-" + node.kind;
    badge.textContent = KINDS[node.kind];
    row.append(badge);
  }
  for (const t of node.tags) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = t;
    row.append(tag);
  }
  row.append(desc);
  const entry = { node, li, details: null, labelEl: label, descEl: desc, parent };
  entries.push(entry);
  if (node.children.length) {
    const details = document.createElement("details");
    details.open = depth < 2;
    const summary = document.createElement("summary");
    summary.appendChild(row);
    const ul = document.createElement("ul");
    for (const c of node.children) ul.appendChild(build(c, depth + 1, entry));
    details.append(summary, ul);
    li.appendChild(details);
    entry.details = details;
  } else {
    li.appendChild(row);
  }
  return li;
}
const rootUl = document.createElement("ul");
rootUl.appendChild(build(DATA.tree, 0, null));
const treeEl = document.getElementById("tree");
treeEl.appendChild(rootUl);
const empty = document.createElement("div");
empty.className = "empty hidden";
empty.textContent = "Nothing matches.";
treeEl.appendChild(empty);

function highlight(el, text, q) {
  el.textContent = "";
  if (!q) { el.textContent = text; return; }
  const lower = text.toLowerCase();
  let i = 0, at;
  while ((at = lower.indexOf(q, i)) !== -1) {
    el.append(text.slice(i, at));
    const m = document.createElement("mark");
    m.textContent = text.slice(at, at + q.length);
    el.append(m);
    i = at + q.length;
  }
  el.append(text.slice(i));
}

const defaultOpen = new Map(entries.filter(e => e.details).map(e => [e, e.details.open]));
function search(raw) {
  const q = raw.trim().toLowerCase();
  let any = false;
  for (const e of entries) {
    highlight(e.labelEl, e.node.label, q);
    highlight(e.descEl, e.node.desc, q);
  }
  if (!q) {
    for (const e of entries) e.li.classList.remove("hidden");
    for (const [e, open] of defaultOpen) e.details.open = open;
    empty.classList.add("hidden");
    return;
  }
  const visible = new Set();
  for (const e of entries) {
    const hit = (e.node.label + " " + e.node.desc).toLowerCase().includes(q);
    if (!hit) continue;
    any = true;
    // A match shows itself, everything under it, and the path above it.
    const stack = [e];
    while (stack.length) {
      const x = stack.pop();
      visible.add(x);
      for (const y of entries) if (y.parent === x) stack.push(y);
    }
    for (let p = e.parent; p; p = p.parent) visible.add(p);
  }
  for (const e of entries) {
    e.li.classList.toggle("hidden", !visible.has(e));
    if (e.details) e.details.open = visible.has(e);
  }
  empty.classList.toggle("hidden", any);
}

const input = document.getElementById("q");
input.addEventListener("input", () => search(input.value));
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== input) { ev.preventDefault(); input.focus(); }
  if (ev.key === "Escape" && document.activeElement === input) { input.value = ""; search(""); }
});
document.getElementById("expand").onclick = () => { for (const e of entries) if (e.details) e.details.open = true; };
document.getElementById("collapse").onclick = () => {
  for (const e of entries) if (e.details) e.details.open = e.parent === null;
};
</script>
</body>
